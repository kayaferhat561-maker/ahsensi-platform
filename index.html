<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ahsen & Ferhat - Platform</title>

  <!-- Font Awesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <!-- Google Fonts (Inter / Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Global Sıfırlama ve Temel Stiller */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: #0f111a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Ana Konteyner */
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Navigasyon / Üst Menü İçi Bağış Butonu */
    .header-nav {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .nav-bynogame-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(228, 30, 63, 0.15);
      border: 1px solid rgba(228, 30, 63, 0.4);
      color: #ff4757;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .nav-bynogame-btn:hover {
      background: #e41e3f;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(228, 30, 63, 0.4);
    }

    /* ByNoGame Destek Kartı (Cam Efekti / Glassmorphism) */
    .donate-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .donate-card:hover {
      transform: translateY(-4px);
      border-color: rgba(228, 30, 63, 0.4);
      box-shadow: 0 15px 35px rgba(228, 30, 63, 0.15);
    }

    .donate-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 71, 87, 0.15);
      color: #ff4757;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .donate-card h3 {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .donate-card p {
      color: #a0a5b5;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ByNoGame Yönlendirme Butonu */
    .bynogame-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #e41e3f 0%, #b30f2b 100%);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 18px rgba(228, 30, 63, 0.35);
    }

    .bynogame-btn:hover {
      background: linear-gradient(135deg, #ff2a4b 0%, #d41434 100%);
      box-shadow: 0 8px 25px rgba(228, 30, 63, 0.55);
      transform: scale(1.02);
    }

    .bynogame-btn i {
      font-size: 0.9rem;
      transition: transform 0.2s ease;
    }

    .bynogame-btn:hover i.fa-arrow-up-right-from-square {
      transform: translate(2px, -2px);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- İsteğe Bağlı: Sayfa Üstü Hızlı Bağış Butonu -->
    <div class="header-nav">
      <a href="https://www.bynogame.com/tr/destek/ferhatkaya09" target="_blank" rel="noopener noreferrer" class="nav-bynogame-btn">
        <i class="fa-solid fa-heart"></i> Destek Ol
      </a>
    </div>

    <!-- Ana ByNoGame Bağış Yönlendirme Kartı -->
    <div class="donate-card">
      <div class="donate-badge">
        <i class="fa-solid fa-heart"></i> YAYINA DESTEK OL
      </div>

      <h3>Yayınları Desteklemek İster misin?</h3>
      <p>Bağış yaparak ekranda mesajını gösterebilir ve canlı yayınlarımıza katkıda bulunabilirsin.</p>

      <!-- Doğrudan ByNoGame Linkine Yönlendiren Buton -->
      <a href="https://www.bynogame.com/tr/destek/ferhatkaya09" target="_blank" rel="noopener noreferrer" class="bynogame-btn">
        <i class="fa-solid fa-gamepad"></i>
        <span>ByNoGame ile Destek Ol</span>
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </a>
    </div>

  </div>

</body>
</html>
